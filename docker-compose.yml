version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sgas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgas_db
      POSTGRES_USER: sgas_user
      POSTGRES_PASSWORD: sgas_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgas_user -d sgas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
