<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b37ff"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)"/>

  <!-- Subtle inner border for contrast -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Academic Graduation Cap (GroupSync Core Symbol) -->
  <!-- Cap top / diamond board -->
  <path d="M32 16 L52 25 L32 34 L12 25 Z" fill="#ffffff"/>
  
  <!-- Under-cap base / skull cap -->
  <path d="M19 28.5 V37 C19 43 45 43 45 37 V28.5 L32 34.5 Z" fill="#e2e8f0"/>

  <!-- Cap tassel -->
  <path d="M47 27.5 V39" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="47" cy="40.5" r="2" fill="#60a5fa"/>

  <!-- Synchronization / Connection nodes at base -->
  <circle cx="26" cy="48" r="2.5" fill="url(#accentGrad)"/>
  <circle cx="32" cy="48" r="2.5" fill="#ffffff"/>
  <circle cx="38" cy="48" r="2.5" fill="url(#accentGrad)"/>
  <path d="M28.5 48 H35.5" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linecap="round"/>
</svg>